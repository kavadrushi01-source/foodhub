name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: npm install --prefix client && npm install --prefix server

      - name: Lint client
        run: npm run lint --prefix client

      - name: Syntax-check server
        run: |
          for f in $(find server/src -name '*.js'); do node --check "$f"; done

      - name: Build client
        run: npm run build --prefix client

      - name: Health-check server boots
        run: |
          MONGODB_URI="mongodb://127.0.0.1:27017/ci" PORT=5999 \
          node server/src/server.js & sleep 8; \
          curl -sS http://127.0.0.1:5999/health; echo