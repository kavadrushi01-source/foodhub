name: Keep HF Space awake

on:
  schedule:
    # Every 12 hours (free Spaces sleep after 48h idle — this keeps them warm)
    - cron: '23 */12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /health to wake the Space
        run: |
          URL="https://kavadrushi01-source-foodhub-api.hf.space/health"
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$URL" || echo 000)
            echo "attempt ${i}: HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "Space is awake and healthy."
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Space did not return 200 after 6 attempts — it may still be waking. Check https://huggingface.co/spaces/kavadrushi01-source/foodhub-api"
