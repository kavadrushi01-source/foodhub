name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-hf.yml'
  workflow_dispatch:

concurrency:
  group: hf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Push server/ contents to the HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: kavadrushi01-source/foodhub-api
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set. Create a write token at https://huggingface.co/settings/tokens/new and add it as a repository secret named HF_TOKEN."
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf space
          git clone --depth 1 "https://kavadrushi01-source:${HF_TOKEN}@huggingface.co/spaces/${HF_REPO}" space

          # Copy server/ to the Space root. .env / node_modules / logs are
          # excluded so secrets and junk never reach the (public) Space repo.
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules/' \
            --exclude '*.log' \
            server/ space/

          cd space
          git add -A
          if git diff --cached --quiet; then
            echo "No server changes to deploy."
          else
            git commit -m "Deploy ${GITHUB_SHA::7} from foodhub"
            git push
            echo "Pushed to HF Space — build started: https://huggingface.co/spaces/${HF_REPO}"
          fi
